<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="./ageCalculator.css">
</head>
<body>
    <main>
        <div>
            <h1>Age Calculator</h1>
        </div>
        <div>
            <form>
                <label for="age">Enter your birth date:</label>
                <input type="date" id="age" name="Birth Date" >
                <button id="button" type="submit">Calculate</button>
            </form>
        </div>
        <div>
            <p id="nowAge"></p>
        </div>
    </main>
</body>
<script src="./ageCalculator.js"></script>
</html>
