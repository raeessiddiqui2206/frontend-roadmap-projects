<html lang="en">
<head>

</head>
<body>
    <main>
        <!-- मुख्य हेडिंग और पैराग्राफ -->
        <h1>Contact Me (मुझसे संपर्क करें)</h1>
        <p>यदि आपके पास कोई सवाल है या आप मुझसे बात करना चाहते हैं, तो नीचे दिए गए फॉर्म या सोशल मीडिया के ज़रिए जुड़ सकते हैं।</p>
    
        <hr>
        <br>

        <h3>Social Profiles</h3>
        <p>Email: <a href="mailto:raeessiddiquiemail@example.com" target="_blank">raeessiddiqui@gmail.com</a></p>
        <p>GitHub: <a href="https://github.com" target="_blank">Visit My GitHub</a></p>
        <p>LinkedIn: <a href="https://linkedin.com" target="_blank">Visit My LinkedIn</a></p>

        <br>
    <hr>
    <br>

    <!-- 2. कांटेक्ट फॉर्म (बिना CSS का सिंपल HTML फॉर्म) -->
    <h3>Send a Message</h3>
    <form action="#">
        <!-- नाम लिखने का बॉक्स -->
        <p>
            <label for="name">Your Name:</label><br>
            <input type="text" id="name" placeholder="अपना नाम लिखें" required>
        </p>

        <!-- ईमेल लिखने का बॉक्स -->
        <p>
            <label for="email">Your Email:</label><br>
            <input type="email" id="email" placeholder="अपनी ईमेल आईडी लिखें" required>
        </p>

        <!-- मैसेज लिखने का बड़ा बॉक्स -->
        <p>
            <label for="message">Your Message:</label><br>
            <textarea id="message" rows="5" placeholder="अपना संदेश यहाँ लिखें" required></textarea>
        </p>

        <!-- सबमिट बटन -->
        <p>
            <button type="submit">Submit Message</button>
        </p>
    </form>
</main>

</body>
</html>
