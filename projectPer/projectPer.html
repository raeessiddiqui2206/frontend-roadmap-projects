<!DOCTYPE html>

<body>
    <main>
        <form>
            <label for="name">Full Name</label>

            <label for="mail">Email</label>
            <input type="email" id="mail" placeholder="Enter Your Email?" name="E-mail" >

            <label for="password">Enter Password</label>

            <label for="password">Confirm Password</label>
            <input type="password" id="password" placeholder="XXXXXXXX" name="Password" >
            <br>

        <div class="leftBox">
            <div class="cir"><h1 class="percentage">65%</h1></div>
            <h2>Profile Completness</h2>
